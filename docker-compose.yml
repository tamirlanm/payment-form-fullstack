services:
  db:
    image: postgres:18
    container_name: payment-postgres
    
    environment:
      POSTGRES_DB: payment_service_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
    ports:
      - "5433:5432"
    
    volumes:
      - payment_data:/var/lib/postgresql

  api:
    build:
      context: ./backend
      dockerfile: DockerFile

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=payment_service_db;Username=payment_user;Password=${POSTGRES_PASSWORD}"
      ApiSecurityKey__Key: ${API_SECURITY_KEY}

    depends_on:
      - db
  
  frontend:
    build: 
      context: ./frontend
      dockerfile: DockerFile
      args:
        VITE_API_BASE_URL: "http://localhost:8080"

    ports:
      - "127.0.0.1:4173:4173"

    depends_on:
      - api

volumes:
  payment_data: